# Model registry: every model the pipeline can evaluate, judge with, or use as
# the MANTA pressure generator. Refer to entries by their key (alias) on the CLI
# or in configs/eval.yaml. Any raw inspect-ai model string (e.g.
# "vllm/Qwen/Qwen3-8B", "hf/google/gemma-3-12b-it", "openai-api/myserver/foo")
# can also be passed on the CLI without being registered here.
#
# Fields (all optional except `model`):
#   model:            inspect-ai model string "<provider>/<model>".
#                       vllm/<hf-repo-or-local-path>              start a local vLLM server
#                       vllm/<base>:<lora-adapter-path-or-repo>    base model + LoRA adapter
#                       hf/<hf-repo-or-local-path>                 plain transformers (slow, no server)
#                       openai-api/<name>/<served-model-name>      any OpenAI-compatible server
#                                                                  (needs <NAME>_BASE_URL / <NAME>_API_KEY env vars or base_url)
#                       mockllm/model                              fake model for pipeline smoke tests
#   extends:          alias of another entry to inherit from (fields are deep-merged).
#   base_url:         connect to an already-running server instead of starting one.
#   model_args:       provider-specific kwargs. For vllm these are forwarded to
#                     `vllm serve` (e.g. quantization, gpu_memory_utilization,
#                     max_model_len, tensor_parallel_size, dtype).
#   generate_config:  inspect GenerateConfig fields applied to every call to this model
#                     (temperature, max_tokens, max_connections, extra_body, ...).
#   metadata:         free-form labels copied into every eval log and results/scores.csv
#                     (family, condition, precision, ...). Keep `condition` and
#                     `precision` accurate; the analysis groups by them.

# Deep-merged into every vllm/* entry below (entries override). Not applied to
# other providers.
vllm_defaults:
  model_args:
    # 0.90 on a headless GPU. At 0.85 an 8B bf16 model on the 24 GB 4090 may not
    # have room for one 16k-token conversation, and vLLM refuses to start.
    gpu_memory_utilization: 0.90
    # Prompt + response tokens per request, not response length (that is max_tokens).
    # 16384 covers MANTA's worst case (5 replies x 2048 + user turns ~ 11.7k).
    # Keep it identical for every target and condition. See
    # material/quantization-strategy.md section 11.
    max_model_len: 16384
  generate_config:
    max_tokens: 2048

models:
  # ---------------------------------------------------------------- base models
  # Revisions are pinned to the downloaded snapshots, so a new upstream release can't
  # change a model mid-study, and cached models load without looking up "main".
  qwen3-8b:
    model: vllm/Qwen/Qwen3-8B
    model_args: {revision: b968826d9c46dd6066d109eabc6255188de91218}
    generate_config:
      # Thinking mode is fixed OFF for data generation, training and eval (see CLAUDE.md).
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
    metadata: {family: qwen3, size: 8b, condition: base, precision: bf16}

  llama3.1-8b:
    model: vllm/meta-llama/Llama-3.1-8B-Instruct
    model_args: {revision: 0e9e39f249a16976918f6564b8830bc894c89659}
    metadata: {family: llama3, size: 8b, condition: base, precision: bf16}

  # Gemma-3-12B in bf16 (~24.4 GB) does not fit the 4090, and bf16 LoRA fits neither
  # GPU, so every Gemma condition uses 4-bit NF4 (material/quantization-strategy.md §1).
  # `gemma3-12b` is only the shared parent of the two entries below.
  gemma3-12b:
    model: vllm/google/gemma-3-12b-it
    model_args:
      revision: 96b6f1eccf38110c56df3a15bffe176da04bfd80
      language_model_only: true   # text-only study: no image inputs, no memory reserved for them
    metadata: {family: gemma3, size: 12b, condition: base, precision: bf16}

  gemma3-12b-nf4:                 # the Gemma model of the study
    extends: gemma3-12b
    model_args: {quantization: bitsandbytes}
    metadata: {precision: bnb-nf4}

  gemma3-12b-bf16-calib:          # one-off check of the 4-bit effect: capability suite on the 5090 only
    extends: gemma3-12b
    model_args: {gpu_memory_utilization: 0.92, max_model_len: 4096}
    metadata: {condition: base-calib}

  # ------------------------------------------------ quantized variants (examples)
  # A quantized base control must be compared against fine-tuned models at the
  # SAME precision. Uncomment / adapt when needed.
  # qwen3-8b-awq:
  #   extends: qwen3-8b
  #   model: vllm/Qwen/Qwen3-8B-AWQ
  #   metadata: {precision: awq-4bit}

  # ------------------------------------------------ fine-tuned variants (examples)
  # LoRA adapters are loaded on top of the base model by vLLM:
  # qwen3-8b-sdf:
  #   extends: qwen3-8b
  #   model: vllm/Qwen/Qwen3-8B:checkpoints/qwen3-8b/sdf
  #   model_args: {max_lora_rank: 64}
  #   metadata: {condition: sdf}
  # qwen3-8b-chat:
  #   extends: qwen3-8b
  #   model: vllm/Qwen/Qwen3-8B:checkpoints/qwen3-8b/chat
  #   metadata: {condition: chat}
  # qwen3-8b-sdf-chat:
  #   extends: qwen3-8b
  #   model: vllm/Qwen/Qwen3-8B:checkpoints/qwen3-8b/sdf_chat
  #   metadata: {condition: sdf_chat}

  # ------------------------------------------------ judges / pressure generators
  # Judge + MANTA pressure: gpt-oss-20b (OpenAI family, not a target family).
  # Frozen for the whole study: model, revision, reasoning effort, temperature.
  # See material/quantization-strategy.md section 12.
  judge-gptoss-20b:
    # Starts its own vLLM server. Use on a single machine (e.g. with Gemma nf4 on the 5090).
    model: vllm/openai/gpt-oss-20b
    model_args:
      revision: 6cee5e81ee83917806bbde320786a8fb61efebee
      gpu_memory_utilization: 0.45
      max_model_len: 32768   # whole MANTA conversation (~12k) + rubric + reasoning
    generate_config:
      temperature: 0.0
      reasoning_effort: medium
      max_tokens: 4096       # reasoning tokens count toward this
    metadata: {role: judge, family: gpt-oss, precision: mxfp4}

  judge-remote:
    # The same judge, served on the 5090 and reached through an SSH tunnel
    # (strategy section 3). Nothing is started locally, so vllm_defaults and
    # model_args don't apply: start the server with
    #   vllm serve openai/gpt-oss-20b --revision 6cee5e81ee83917806bbde320786a8fb61efebee \
    #     --host 127.0.0.1 --port 8001 --gpu-memory-utilization 0.92 --max-model-len 32768
    # Keep generate_config and metadata identical to judge-gptoss-20b. Not `extends`,
    # because inherited server args (gpu_memory_utilization, ...) can't be cleared.
    model: vllm/openai/gpt-oss-20b
    base_url: http://localhost:8001/v1
    generate_config:
      temperature: 0.0
      reasoning_effort: medium
      max_tokens: 4096
    metadata: {role: judge, family: gpt-oss, precision: mxfp4}

  # ------------------------------------------------------------ data generation
  # Not a target family and not the judge (strategy section 13). Intel's 4-bit
  # AutoRound build: only the language layers are quantized, and images are disabled.
  generator-mistral-small:
    model: vllm/Intel/Mistral-Small-3.2-24B-Instruct-2506-int4-AutoRound
    model_args:
      revision: 21907bf9a442ec05c91e059ef17b08a8b44983f5
      language_model_only: true
      max_model_len: 8192    # constitution (~1.5-4k) + instructions + output (<= 2048)
    generate_config:
      temperature: 0.8
      max_tokens: 2048
    metadata: {role: generator, family: mistral, precision: int4-autoround}

  # ------------------------------------------------------------ testing only
  mock:
    model: mockllm/model
    metadata: {condition: mock, precision: none}
