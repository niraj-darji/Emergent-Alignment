# Run 4: High-Concentration AFT (2.5M MSM Base + 20% General SFT + 80% AW Demonstrations)
# Starting Foundation: midtrain_aw_main_v1_m1 (2.5M tokens MSM)
# SFT Mixture: mix_p80 (80% AW Demonstrations of non-identity budget, 20% General SFT, 2500 Identity Dialogues)

mode: aft

model:
  base_path: runs/checkpoints/midtrain_aw_main_v1_m1
  dtype: bfloat16
  attn_implementation: sdpa
  chat_template: configs/chat_template.jinja

lora:
  r: 64
  alpha: 128
  dropout: 0.0
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  arm: run4_msm25
  corpus_id: mix_p80
  sft_path: data/aft/mix_p80.jsonl
  seq_len: 4096
  heldout_frac: 0.02
  split_seed: 0

train:
  seed: 1
  micro_batch_size: 2
  grad_accum_steps: 8
  lr: 1.0e-4
  schedule: cosine
  warmup_frac: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  epochs: 1
  gradient_checkpointing: true
  allow_tf32: true
  eval_every: 50
  save_every: 100
  max_steps: null

wandb:
  project: aw-msm
  group: p-ablation-0-to-100
  name: aft_run4_msm25_mix_p80_m1_a1
