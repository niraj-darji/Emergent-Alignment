# Benchmark suite configuration. Every model and condition is evaluated on
# exactly the same samples (seeded subsample below), with the same judge and
# the same pressure generator. Change these only between studies, never between
# models of the same study.

seed: 1234            # subsample seed, shared by all benchmarks
log_dir: logs         # inspect logs go to <log_dir>/<run_name>/<model_alias>/

# Helper models, by alias from configs/models.yaml (or raw inspect model strings).
# Only benchmarks that list a role under `roles:` load that model.
# NOTE: with local vLLM, the target and the judge run at the same time during
# ANIMA/MANTA/sycophancy. Either give both a small enough gpu_memory_utilization, or serve
# the judge separately and point to it with `base_url`.
roles:
  grader: judge-remote     # gpt-oss-20b on the 5090; scores ANIMA, MANTA and sycophancy
  pressure: judge-remote   # writes MANTA turn-2 anchor and turn 3-5 pressure messages
  # Single machine instead? Pass --grader judge-gptoss-20b --pressure judge-gptoss-20b.

# Benchmarks. Fields:
#   task:            "module.path:function" returning an inspect Task.
#   task_args:       kwargs passed to that function.
#   limit:           number of samples after the seeded shuffle (null = all).
#   epochs:          repeats per sample (overrides the task default).
#   roles:           helper roles this benchmark needs (from `roles` above).
#   generate_config: GenerateConfig overrides for the target model on this benchmark.
#   group:           reporting axis (animal_welfare / human_safety / capability).
#   headline:        metric shown in the summary table (all metrics go to the long CSV).
#   shuffle_choices: shuffle multiple-choice answer order with `seed` (for datasets
#                    whose correct answer always sits in the same position).
#   task_args values "role:<name>" are replaced by that role's model, e.g. to make
#   a task's own scorer use the judge instead of the target.
benchmarks:
  anima:
    headline: overall_mean
    task: inspect_evals.anima:anima
    task_args: {languages: [English]}
    limit: null           # 115 English questions; small enough to run in full
    epochs: 1             # upstream recommends 5; raise if compute allows
    roles: [grader]
    group: animal_welfare

  manta:
    headline: awvs
    task: benchmarks.manta:manta
    task_args: {}
    limit: 150            # of 1090 species-instantiated scenarios (5 turns each)
    epochs: 1
    roles: [grader, pressure]
    group: animal_welfare

  mmlu:
    headline: accuracy
    task: inspect_evals.mmlu:mmlu_0_shot
    task_args: {shuffle: false}   # we shuffle with our own seed instead
    limit: 1000
    epochs: 1
    roles: []
    group: capability

  hellaswag:
    headline: accuracy
    task: inspect_evals.hellaswag:hellaswag
    task_args: {}
    limit: 1000
    epochs: 1
    roles: []
    group: capability

  # ---------------------------------------------------------------- human safety
  bbq:
    headline: ambig       # accuracy on ambiguous contexts: wrong = stereotype-driven guess
    task: benchmarks.bbq:bbq
    task_args: {shuffle: false}
    limit: 1000           # of ~58.5k, all 11 bias categories; ~half ambiguous, half disambiguated
    epochs: 1
    roles: []
    group: human_safety

  hhh:
    headline: accuracy
    task: benchmarks.hhh:hhh
    task_args: {}
    limit: null           # 221 items (harmless / helpful / honest / other); run in full
    epochs: 1
    shuffle_choices: true # the preferred reply is always first in the source data
    roles: []
    group: human_safety

  sycophancy:
    headline: confidence  # of initially correct answers, share kept after "Are you sure?" (higher = better)
    task: inspect_evals.sycophancy:sycophancy
    task_args:
      shuffle: false
      scorer_model: role:grader   # otherwise it grades with the target model itself
    limit: 500
    epochs: 1
    roles: [grader]
    group: human_safety

# Named groups usable in --benchmarks on the CLI.
suites:
  animal_welfare: [anima, manta]
  human_safety: [bbq, hhh, sycophancy]
  capability: [mmlu, hellaswag]
  all: [anima, manta, bbq, hhh, sycophancy, mmlu, hellaswag]
